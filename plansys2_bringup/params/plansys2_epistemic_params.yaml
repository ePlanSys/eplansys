# Parameters for running PlanSys2 with the epistemic plan solver.
#
# Pass it explicitly, since the default params file keeps POPF:
#
#   ros2 launch plansys2_bringup plansys2_bringup_launch_monolithic.py \
#     model_file:=<domain.pddl> \
#     params_file:=<share>/plansys2_bringup/params/plansys2_epistemic_params.yaml
#
# The epistemic problem is stated in EPDDL, not in PDDL, and it is named by the
# epddl_domain and epddl_problem parameters below rather than by the launch
# file. plansys2_epddl_grounder grounds those sources through plank on first
# use and again whenever they change.
#
# model_file is still required by the launch file, still feeds the domain
# expert, and is still what the executor consults to find the behavior tree
# that drives the hardware for an action. It is the PDDL side of the same
# mission; the epistemic side is the EPDDL pair.
#
# Executing a policy also needs the epistemic state holding the same task. Add
# epistemic_state:=True to either launch file and it is started and brought up
# with the other four nodes; the epistemic_state section below names the same
# two EPDDL files the solver is given.
#
# epistemic_perception:=True adds a sixth node, which reads named regions of an
# occupancy grid and reports them to that state. It is what a policy needs when
# the thing that does the sensing is a map rather than an operator. It needs
# epistemic_state:=True, and it starts with no regions until the section at the
# end of this file names some.
plansys2:
  ros__parameters:
    use_real_time: false

    # There is deliberately no use_epistemic_state here. It is set by the
    # launch argument epistemic_state:=True, which is the same switch that
    # starts the node; setting it in a parameters file alone would have the
    # system wait to manage a node nobody launched.
planner_client:
  ros__parameters:
    plan_solver_timeout: 15.0
planner:
  ros__parameters:
    plan_solver_timeout: 15.0
    plan_solver_plugins: ["EPISTEMIC"]
    EPISTEMIC:
      plugin: "plansys2/EpistemicPlanSolver"

      # The EPDDL sources. This is the ordinary way to state the problem, and
      # the epistemic counterpart of model_file.
      epddl_domain: ""
      epddl_problem: ""

      # Action-type libraries the domain declares in its
      # `:action-type-libraries` clause. Leaving the key out supplies the
      # `intermediate` library packaged with plansys2_epddl_grounder, which is
      # the one the example domains use. Uncomment to name others:
      #
      #   epddl_libraries: ["/abs/path/to/library.epddl"]
      #
      # Write it out or leave it out — never as an empty list. A `[]` in a ROS
      # parameters file has no element type, so the override reaches the node
      # with no value at all and node construction throws before any of this
      # package's code runs.

      # Path to the plank binary. Empty takes the PLANK environment variable,
      # then PATH — and building the workspace puts plank on PATH, so this is
      # normally left alone.
      plank_command: ""

      # Absolute path to an already grounded task JSON, for a task ground
      # outside this workspace. Ignored when the EPDDL sources above are set.
      # Leave both empty to require the task to arrive in the get_plan request
      # instead.
      task_file: ""

      # Take the goal from the epistemic state when it publishes one, rather
      # than from the task. This is what makes
      #
      #   ros2 plansys2 epistemic goal "(Kw c1 muddy_c1)"
      #
      # change what the next plan is built for, without re-grounding the
      # problem. The task's own goal is used whenever the state is not running
      # or is reporting that same goal back. Set false to plan for the problem
      # exactly as written, whatever anyone asks for at run time.
      goal_from_state: true

      # Empty means the built-in selection policy decides from the task's own
      # structure, which is the intended default. Set explicitly to pin one:
      #   heuristic: ug | ed | ks | wc | rpg | radd
      #   strategy:  gbfs | ehc | aostar
      heuristic: ""
      strategy: ""

      # Path to a JSON selection policy replacing the built-in rule table.
      policy_file: ""

      # Path to a JSON map from grounded epistemic action names to PlanSys2
      # action expressions, e.g. {"ask_c1": {"action": "(ask c1)",
      # "duration": 2.0}}. See examples/mappings in the planner package.
      #
      # Leaving it empty falls back to a naming convention that splits the
      # grounded name at its first underscore. That convention cannot know the
      # parameter order the domain declares, so set this before dispatching to
      # real actions; an action the map does not cover fails the request rather
      # than reaching the executor as a name it cannot resolve.
      action_mapping: ""

      # What to do with a branching solution:
      #   policy  - keep the branches, in the epistemic fields of the Plan.
      #             Needs the executor settings below; this is the mode the
      #             epistemic behavior tree exists for.
      #   flatten - return the lowest-event branch and warn. The result is a
      #             plain sequence, valid only if execution takes that one
      #             contingency, and runnable by a stock PlanSys2 executor.
      #   reject  - fail rather than return a plan that is only conditionally
      #             valid.
      conditional_plan: "policy"

      # The same planning is available from an external Aletheia binary rather
      # than in process, through plansys2_aletheia_plan_solver. It takes these
      # parameters under the same names, so switching is a matter of naming the
      # other plugin:
      #
      #   plan_solver_plugins: ["ALETHEIA"]
      #   ALETHEIA:
      #     plugin: "plansys2/AletheiaPlanSolver"
      #     command: "/abs/path/to/epistemic_planner"
      #     task_file: "/abs/path/to/grounded-task.json"
      #     conditional_plan: "policy"
      #
      # That plugin reads a grounded task only; ground the EPDDL first with
      # `ros2 run plansys2_epddl_grounder ground_epddl`.
      #
      # In-process is the better default: no fork, no serialisation, and no
      # binary to install. Use the subprocess plugin when the planner is built
      # and versioned separately from this workspace.
epistemic_state:
  ros__parameters:
    # The same problem the solver above is given. Both halves have to hold one
    # task: a policy names its actions in the grounded vocabulary, and a state
    # loaded from a different task would be asked about symbols it does not
    # have. Naming the same two files twice is what keeps them one task; the
    # node grounds them itself rather than being handed the planner's result,
    # because a service call at configure time would make the two nodes depend
    # on each other's start-up order.
    epddl_domain: ""
    epddl_problem: ""
    plank_command: ""

    # As above: name libraries explicitly or omit the key. Never `[]`.
    #   epddl_libraries: ["/abs/path/to/library.epddl"]

    # An already grounded task, as the alternative. Ignored when the EPDDL
    # sources are set.
    task_file: ""

    # This node also holds the goal, which is what makes it the epistemic
    # counterpart of the problem expert rather than only a service the
    # executor calls. It starts as the loaded task's own goal; changing it is
    #
    #   ros2 plansys2 epistemic goal "(Kw c1 muddy_c1)"
    #
    # and the solver above picks the change up through goal_from_state.
executor:
  ros__parameters:
    # Renders the policy as a tree: the PlanSys2 action subtree with a
    # knowledge guard and a DEL update around it, and a branch on what was
    # observed. A plan without branches renders as the usual sequence.
    bt_builder_plugin: "EpistemicBTBuilder"

    # The nodes that tree uses, which the executor does not know by itself.
    # Loading them rather than linking them is what keeps plansys2_executor
    # independent of the epistemic packages.
    bt_node_plugins: ["libplansys2_epistemic_bt_nodes.so"]

# Only read when epistemic_perception:=True, and only useful once `regions`
# names something. The atoms a region decides have to be atoms of the task the
# two nodes above are holding: a region whose atom is not in that task resolves
# to a formula the state cannot parse, and says so on the first observation.
#
# A worked example, the corridor of the fleet tutorial, is in
# <share>/plansys2_epistemic_perception/params/fleet_corridor_regions.yaml.
epistemic_perception:
  ros__parameters:
    # The grid to watch. Subscribed transient-local, so a map published before
    # this node came up still counts.
    map_topic: "/map"

    # The regions to watch, each one's settings declared under its own name.
    # Empty means a node that runs and reports nothing.
    #
    #   regions: ["corridor"]
    #   corridor:
    #     # [min_x, min_y, max_x, max_y] per box, in metres in the map frame;
    #     # their union is the region. Metres rather than cell indices because
    #     # a map is re-gridded as it grows, and indices would quietly come to
    #     # mean somewhere else.
    #     boxes: [2.0, -0.5, 8.0, 0.5, 7.5, 0.5, 8.5, 4.0]
    #
    #     # The atom this region's occupancy decides, and which way it points.
    #     # `blocked` with atom_true_when_clear: false is the corridor of the
    #     # fleet tutorial; `clear_corridor` with it true says the same thing
    #     # the other way, and both occur in real domains.
    #     atom: "blocked"
    #     atom_true_when_clear: false
    #
    #     # The grounded sensing action this observation answers, with the
    #     # event that fired in each case. Omit all three and the observation
    #     # goes out as a public announcement instead, which is what the state
    #     # offers for something that arrived from outside the plan.
    #     sensing_action: "inspect_r1"
    #     outcome_when_clear: "e-inspect-clear"
    #     outcome_when_blocked: "e-inspect-blocked"
    regions: []

    # Where the line falls between free, occupied and undecided, on the nav2
    # and slam_toolbox convention. Both are occupancy values, within 0..100. A
    # cell between the two has been seen without being settled and counts as
    # unobserved: calling it free would hand an agent knowledge it does not
    # have.
    free_below: 25
    occupied_above: 65

    # Seconds to wait for the state to answer one call.
    call_timeout: 5.0
