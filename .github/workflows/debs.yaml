name: debian packages (humble)

# On a release tag, builds every eplansys package for ROS 2 Humble with bloom
# and attaches the .debs, with the index apt reads, to that tag's GitHub
# release. The release is then an apt repository:
#
#   echo "deb [trusted=yes] https://github.com/ePlanSys/eplansys/releases/download/v0.4.1 ./" |
#     sudo tee /etc/apt/sources.list.d/eplansys.list
#   sudo apt update && sudo apt install ros-humble-eplansys
#
# workflow_dispatch builds the same packages and keeps them as a workflow
# artifact, without a release, for trying a change to the packaging.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debs:
    runs-on: ubuntu-22.04
    container:
      image: ros:humble
    steps:
      - uses: actions/checkout@v4
        with:
          path: ws/src/eplansys
          # The version check compares against the previous release tag, so
          # the history and the tags have to be there.
          fetch-depth: 0

      - name: Install the packaging tools
        run: |
          apt-get update
          apt-get install -y python3-bloom python3-vcstool fakeroot debhelper dh-python python3-all dpkg-dev apt-utils
          rosdep update --rosdistro humble

      - name: Import the pinned sources
        run: vcs import ws/src < ws/src/eplansys/dependency_repos.repos

      # apt never upgrades a package to one of the same version, so a release
      # that changed a package without a new version never reaches the users
      # of the previous one. Refuse the tag rather than publish it.
      - name: Check that every changed package has a new version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config --global --add safe.directory "$PWD/ws/src/eplansys"
          git config --global --add safe.directory "$PWD/ws/src/aletheia"
          ws/src/eplansys/packaging/check-versions.sh "" "$PWD/ws/src"

      - name: Build the packages
        run: ws/src/eplansys/packaging/build-debs.sh ws debs

      - name: Keep them as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: debs-humble
          path: debs/

      - name: Attach them to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            debs/*.deb
            debs/Packages
            debs/Packages.gz
            debs/Release
