name: Doxygen Deployment

on:
  push:
    branches:
      - rolling
  schedule:
    - cron: '0 0 * * 6'
  workflow_dispatch:

# One run at a time. Every run checks gh-pages out, rewrites it and pushes, so
# two merges close together raced and the second was rejected with "fetch
# first" -- a red tick on a workflow that had nothing wrong with it. A run
# already in progress is left to finish rather than cancelled, since the one
# that wins is the one whose output is published.
concurrency:
  group: doxygen-gh-pages
  cancel-in-progress: false

jobs:
  doxygen_generation:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Doxygen for PlanSys2
        uses: mattnotmitt/doxygen-action@edge
        with:
          doxyfile-path: ".github/Doxyfile"

      - name: Doxygen Deployment
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: docs/html
