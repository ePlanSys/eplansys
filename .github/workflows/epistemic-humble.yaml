name: epistemic-planner (humble)

# Builds and tests the epistemic planner and the packages it depends on:
# plansys2_msgs, plansys2_pddl_parser, plansys2_core, then
# plansys2_epistemic_planner itself (action-ros-ci builds --packages-up-to
# the named package).
#
# Humble rather than rolling, for two reasons found by reproducing both in
# their respective containers:
#
#   - rolling removed ament_index_cpp/get_package_share_directory.hpp, which
#     plansys2_pddl_parser's test still includes. Humble still ships it.
#   - the fork's sources are the rolling branch, so packages outside this
#     dependency chain (plansys2_lifecycle_manager and everything after it)
#     use rclcpp::experimental::executors, which does not exist in Humble.
#     Widening the package list here will fail until those are ported.
#
# The one source dependency this chain has is plank, the EPDDL grounder that
# plansys2_epddl_grounder runs; popf and cascade_lifecycle are only required by
# packages further down the graph, and rosdep skips them because nothing named
# here depends on them.

on:
  push:
    branches: [ rolling ]
  pull_request:
    branches: [ rolling ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    # setup-ros on a bare runner installs the tooling (colcon, rosdep, vcstool)
    # but not a ROS distribution, so plansys2_msgs failed to configure with
    # "No 'rosidl_typesupport_c' found" — there was no typesupport or RMW
    # implementation for rosidl to generate against.
    #
    # The official ros:humble image carries ros-base, which includes
    # rosidl_typesupport_{c,cpp,fastrtps_*} and rmw_fastrtps_cpp, and it is the
    # environment this chain was verified in. Same reasoning as rolling.yaml.
    container:
      image: ros:humble
    steps:
      - uses: actions/checkout@v4

      # ros-humble-behaviortree-cpp 4.9.1 installs its library as
      # lib/x86_64-linux-gnu/libbehaviortree_cpp.so, while the exported-library
      # check ament generates for it looks in lib/ alone, with NO_DEFAULT_PATH.
      # find_package(behaviortree_cpp) therefore fails with "exports the
      # library 'behaviortree_cpp' which couldn't be found", and takes
      # plansys2_epistemic_executor down with it. 4.9.0 installed it in lib/,
      # which is why this appeared without a change on our side.
      #
      # Installing the dependency here rather than leaving it to rosdep is what
      # makes the link possible before the build; rosdep then finds it already
      # present. Remove once upstream restores the layout.
      - name: Work around the behaviortree_cpp library layout
        run: |
          apt-get update
          apt-get install -y ros-humble-behaviortree-cpp
          if [ -f /opt/ros/humble/lib/x86_64-linux-gnu/libbehaviortree_cpp.so ] && \
             [ ! -e /opt/ros/humble/lib/libbehaviortree_cpp.so ]; then
            ln -s x86_64-linux-gnu/libbehaviortree_cpp.so \
                  /opt/ros/humble/lib/libbehaviortree_cpp.so
          fi

      - name: Install plank's build dependencies
        # plank is a plain CMake project with no package.xml, so rosdep has
        # nothing to resolve for it and Boost has to be installed by hand.
        run: apt-get update && apt-get install -y libboost-filesystem-dev

      - name: Build and test
        uses: ros-tooling/action-ros-ci@0.4.5
        with:
          # The executor-side packages build here too: they depend on
          # plansys2_msgs and the planner, not on plansys2_executor. Only
          # plansys2_epistemic_bt_builder does, which is why it is a separate
          # package and why it is absent from this list — see rolling.yaml.
          package-name: plank plansys2_epddl_grounder plansys2_epistemic_planner plansys2_epistemic_msgs plansys2_epistemic_executor plansys2_epistemic_perception plansys2_aletheia_plan_solver
          vcs-repo-file-url: ${GITHUB_WORKSPACE}/dependency_repos.repos
          target-ros2-distro: humble
          # action-ros-ci runs 'colcon lcov-result' and 'colcon
          # coveragepy-result' unless this is off, and the ros:humble image
          # carries only colcon-common-extensions, which provides neither:
          # the run died on "invalid choice: 'coveragepy-result'". Nothing
          # consumes coverage from this job (only rolling.yaml uploads to
          # Codecov), so turn it off rather than install the extensions.
          coverage-result: false
          # Temporary, while a find_package(plansys2_msgs) failure that does
          # not reproduce locally is being diagnosed.
          #   --executor sequential      forces true build ordering, so a
          #                              missing dependency edge cannot hide
          #                              behind concurrent execution
          #   --event-handlers console_direct+
          #                              unbuffers per-package output, which
          #                              console_cohesion+ groups on completion
          #                              and thereby scrambles apparent order
          # Remove both once the cause is known; sequential builds are slower.
          colcon-extra-args: --executor sequential --event-handlers console_direct+
          colcon-defaults: |
            {
              "test": {
                "parallel-workers" : 1
              }
            }
