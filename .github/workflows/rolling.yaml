name: rolling

on:
  pull_request:
    branches:
      - rolling
  push:
    branches:
      - rolling
  schedule:
      - cron: '0 0 * * 6'
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    # ROS 2 rolling moved to Ubuntu 26.04 (resolute); no rolling binaries are
    # published for noble any more. Building in ubuntu:noble left setup-ros
    # with nothing to install, so the first package failed on
    # find_package(ament_cmake) — ROS itself was absent, not any one package.
    #
    # The official ros:rolling image already carries a matching ROS on the
    # right platform, which is why the separate setup-ros step is gone.
    container:
      image: ros:rolling
    steps:
      - uses: actions/checkout@v4
      - name: Install popf and plank deps
        # libfl-dev is popf's; libboost-filesystem-dev is plank's, which is a
        # plain CMake project with no package.xml and so no rosdep key of its
        # own for rosdep to resolve.
        run: apt-get update && apt-get install -y libfl-dev libboost-filesystem-dev

      # coverage-result below makes action-ros-ci run 'colcon lcov-result' and
      # 'colcon coveragepy-result'. Neither verb comes from
      # colcon-common-extensions, which is all the ros:rolling image carries,
      # so colcon rejected them as an invalid choice. setup-ros used to install
      # these; since the container replaced it, install them here.
      # python3-pytest-cov backs the coverage-pytest mixin below, which is what
      # gives plansys2_support_py and plansys2_tui_cli coverage.
      - name: Install the colcon coverage extensions
        run: apt-get install -y lcov python3-colcon-lcov-result python3-colcon-coveragepy-result python3-pytest-cov

      # Two pieces of setup that have to happen before action-ros-ci runs.
      #
      # The image already registers a mixin repository called 'default', and
      # the action runs a bare 'colcon mixin add default' whose non-zero exit
      # is not ignored, so the job would die on "a repository with the name
      # 'default' already exists". Dropping it first lets the action add it.
      #
      # The lcovrc goes to an absolute path because the action copies the
      # checkout into ros_ws/src/<random>/, so nothing in the repo has a path
      # that can be named in colcon-defaults below.
      - name: Prepare the coverage configuration
        run: |
          colcon mixin remove default || true
          cp .github/lcovrc /tmp/lcovrc
      - name: build and test
        uses: ros-tooling/action-ros-ci@0.4.5
        with:
          # plank is named explicitly because nothing declares a build
          # dependency on it: plansys2_epddl_grounder runs it as a subprocess
          # and finds it on PATH, so --packages-up-to would never reach it and
          # the grounder's end-to-end test would skip rather than run.
          package-name: plank plansys2_aletheia_plan_solver plansys2_bringup plansys2_bt_actions plansys2_core plansys2_domain_expert plansys2_epddl_grounder plansys2_epistemic_bt_builder plansys2_epistemic_executor plansys2_epistemic_msgs plansys2_epistemic_planner plansys2_executor plansys2_lifecycle_manager plansys2_msgs plansys2_pddl_parser plansys2_planner plansys2_popf_plan_solver plansys2_problem_expert plansys2_support_py plansys2_terminal plansys2_tests plansys2_tools plansys2_tui_cli
          target-ros2-distro: rolling
          # Temporary diagnostic; see epistemic-humble.yaml for the rationale.
          colcon-extra-args: --executor sequential --event-handlers console_direct+
          # coverage-gcc puts --coverage on the C/C++ flags and coverage-pytest
          # turns on AMENT_CMAKE_PYTEST_WITH_COVERAGE; without them the build is
          # uninstrumented, gcov writes nothing, and lcov-result reports an
          # empty total_coverage.info. action-ros-ci runs 'colcon mixin
          # add/update' only when this input mentions "mixin", which is what
          # makes colcon-mixin-repository below take effect.
          #
          # The lcov-result entries are the only way to reach that verb: the
          # action composes its command line itself. lcov 2.x treats gcov's
          # bookkeeping for gtest bodies as a fatal inconsistency, which aborts
          # the run and produces no total_coverage.info; lcov-args covers the
          # capture step and the config file covers aggregation, which
          # lcov-args does not reach.
          #
          # packages-ignore lists the ament_cmake packages that produce no
          # .gcda at all: they are launch/config only, so no coverage.info is
          # written for them, and colcon-lcov-result stats that file without
          # checking it exists. The resulting FileNotFoundError aborts the
          # aggregation for every package, not just those, and leaves no
          # total_coverage.info for Codecov to upload.
          colcon-defaults: |
            {
              "build": {
                "mixin": ["coverage-gcc", "coverage-pytest"]
              },
              "test": {
                "mixin": ["coverage-pytest"],
                "parallel-workers" : 1
              },
              "lcov-result": {
                "lcov-config-file": "/tmp/lcovrc",
                "lcov-args": ["--ignore-errors", "inconsistent,corrupt,mismatch,unused,empty,negative,source,graph,gcov,deprecated"],
                "packages-ignore": ["plansys2_bringup", "plansys2_tools", "plansys2_epistemic_bt_builder", "plank"]
              }
            }
          vcs-repo-file-url: ${GITHUB_WORKSPACE}/dependency_repos.repos
          # action-ros-ci 0.4.x dropped colcon-mixin-name; coverage-result is
          # the supported way to produce the lcov data Codecov consumes below.
          coverage-result: true
          colcon-mixin-repository: https://raw.githubusercontent.com/colcon/colcon-mixin-repository/master/index.yaml
      - name: Codecov
        uses: codecov/codecov-action@v5.4.0
        with:
          # v5 takes 'files', not the 'file' of older majors; the old name was
          # silently ignored, leaving Codecov to guess by searching the tree.
          files: ros_ws/lcov/total_coverage.info
          flags: unittests
          name: codecov-umbrella
          # yml: ./codecov.yml
          fail_ci_if_error: false
