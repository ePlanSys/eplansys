<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ePlanSys">
  <title>ePlanSys</title>
  <!-- Three worlds and the accessibility between them, drawn plain: the
       smallest object the planner reasons about. Sized for a browser tab, so
       the stroke stays heavy enough to read at 16 pixels. -->
  <g fill="none" stroke="#D4AF37" stroke-width="5" stroke-linecap="round">
    <line x1="19" y1="21" x2="19" y2="43"/>
    <line x1="25" y1="17" x2="41" y2="27"/>
    <line x1="25" y1="47" x2="41" y2="37"/>
    <circle cx="19" cy="14" r="7"/>
    <circle cx="19" cy="50" r="7"/>
    <circle cx="46" cy="32" r="7"/>
  </g>
</svg>
