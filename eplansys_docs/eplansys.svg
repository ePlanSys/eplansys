<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="320" height="72" role="img" aria-label="ePlanSys">
  <title>ePlanSys</title>
  <!-- Three worlds and the accessibility between them: the smallest thing the
       planner reasons about. Drawn plain, in one colour, at one stroke width. -->
  <g fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round">
    <line x1="24" y1="22" x2="24" y2="50"/>
    <line x1="31" y1="19" x2="51" y2="31"/>
    <line x1="31" y1="53" x2="51" y2="41"/>
    <circle cx="24" cy="16" r="6"/>
    <circle cx="24" cy="56" r="6"/>
    <circle cx="57" cy="36" r="6"/>
  </g>
  <text x="82" y="49" fill="#D4AF37"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="36" font-weight="600" letter-spacing="0.5"
        textLength="212" lengthAdjust="spacingAndGlyphs">ePlanSys</text>
</svg>
