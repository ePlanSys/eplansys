<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470"
     font-family="Arial, Helvetica, sans-serif" role="img"
     aria-label="How an EPDDL domain travels from source to a fleet">
  <style>
    .box  { fill:#FAFAFA; stroke:#D6D6D6; stroke-width:1.5 }
    .key  { fill:#FFFFFF; stroke:#C8102E; stroke-width:2 }
    .name { font-size:14px; font-weight:bold; fill:#111111 }
    .role { font-size:12px; fill:#5A5A5A }
    .art  { font-family:'Courier New',Courier,monospace; font-size:11.5px; fill:#1A52A0 }
    .flow { stroke:#111111; stroke-width:1.5; fill:none; marker-end:url(#s) }
    .back { stroke:#C8102E; stroke-width:1.5; fill:none; marker-end:url(#r); stroke-dasharray:5 4 }
    .cap  { font-size:11.5px; fill:#5A5A5A; font-style:italic }
    .stage{ font-family:'Courier New',Courier,monospace; font-size:10.5px; fill:#5A5A5A }
  </style>
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C8102E"/></marker>
  </defs>

  <text class="stage" x="20" y="26">STATED</text>
  <rect class="box" x="20" y="36" width="200" height="76" rx="3"/>
  <text class="name" x="36" y="60">EPDDL</text>
  <text class="role" x="36" y="79">a domain, an instance,</text>
  <text class="role" x="36" y="95">an action-type library</text>

  <path class="flow" d="M222,74 L272,74"/>
  <text class="art" x="228" y="66">sources</text>

  <rect class="box" x="274" y="36" width="200" height="76" rx="3"/>
  <text class="name" x="290" y="60">plank</text>
  <text class="role" x="290" y="79">parses, type checks,</text>
  <text class="role" x="290" y="95">grounds, validates</text>

  <path class="flow" d="M476,74 L526,74"/>
  <text class="art" x="480" y="66">task</text>

  <rect class="key" x="528" y="36" width="200" height="76" rx="3"/>
  <text class="name" x="544" y="60">Aletheia</text>
  <text class="role" x="544" y="79">AO* over pointed models;</text>
  <text class="role" x="544" y="95">returns a policy</text>

  <path class="flow" d="M628,114 L628,152"/>
  <text class="art" x="636" y="138">policy</text>

  <text class="stage" x="20" y="176">EXECUTED</text>
  <rect class="key" x="528" y="186" width="200" height="96" rx="3"/>
  <text class="name" x="544" y="210">epistemic state</text>
  <text class="role" x="544" y="229">holds the Kripke model;</text>
  <text class="role" x="544" y="245">applies the product update</text>
  <text class="role" x="544" y="261">after every action</text>

  <path class="flow" d="M526,234 L476,234"/>

  <rect class="box" x="274" y="186" width="200" height="96" rx="3"/>
  <text class="name" x="290" y="210">PlanSys2 executor</text>
  <text class="role" x="290" y="229">renders the policy as a</text>
  <text class="role" x="290" y="245">behaviour tree and</text>
  <text class="role" x="290" y="261">dispatches its actions</text>

  <path class="flow" d="M272,234 L222,234"/>
  <text class="art" x="222" y="226">action</text>

  <rect class="box" x="20" y="186" width="200" height="96" rx="3"/>
  <text class="name" x="36" y="210">performer</text>
  <text class="role" x="36" y="229">the hardware, or</text>
  <text class="role" x="36" y="245">eplansys_rmf_bridge</text>
  <text class="role" x="36" y="261">for a fleet</text>

  <path class="flow" d="M120,284 L120,322"/>

  <text class="stage" x="20" y="346">DRIVEN</text>
  <rect class="box" x="20" y="356" width="200" height="76" rx="3"/>
  <text class="name" x="36" y="380">Open-RMF</text>
  <text class="role" x="36" y="399">lifts, doors, floor space,</text>
  <text class="role" x="36" y="415">traffic between fleets</text>

  <path class="back" d="M222,394 L520,394 L520,286"/>
  <text class="art" x="300" y="386">outcome</text>
  <text class="role" x="300" y="414">what the robot observed, which decides the branch</text>

  <text class="cap" x="20" y="450">Red marks the two components that hold or search a Kripke model.</text>
  <text class="cap" x="20" y="464">The outcome path is what makes execution epistemic: a sensing action reports the event that fired, and the state applies it.</text>
</svg>
